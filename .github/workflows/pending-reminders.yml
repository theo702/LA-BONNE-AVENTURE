# Rappels hebdomadaires des réservations non finalisées + expiration J-1.
# Requis dans les secrets GitHub du dépôt :
#   CRON_SECRET  — même valeur que `wrangler pages secret put CRON_SECRET`
#   SITE_URL     — optionnel, défaut https://labonneaventure-aixlesbains.fr
name: Rappels séjours en attente

on:
  schedule:
    # Lundi 08:00 UTC ≈ 09:00/10:00 Paris
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler le cron pending-reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Secret CRON_SECRET manquant — ignore ce run."
            exit 0
          fi
          BASE="${SITE_URL:-https://labonneaventure-aixlesbains.fr}"
          BASE="${BASE%/}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${BASE}/api/cron/pending-reminders" \
            | tee /tmp/cron-out.json
          python3 -c "import json,sys; d=json.load(open('/tmp/cron-out.json')); assert d.get('ok') is True, d"
