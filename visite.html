<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4HX22H9KXF"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-4HX22H9KXF');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>La Bonne Aventure — Visite du studio</title>
<meta name="description" content="Visite guidée du studio La Bonne Aventure à Aix-les-Bains : cuisine, coin nuit et cinéma, salle d'eau, cour privée.">
<meta property="og:title" content="Visite du studio — La Bonne Aventure">
<meta property="og:description" content="Faites le tour du studio avant d'arriver.">
<meta property="og:image" content="https://labonneaventure-aixlesbains.fr/assets/studio-1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<style>
:root{--navy:#0f2a4a;--navy-d:#08192e;--gold:#d9971a;--gold-l:#e6a92c;--cream:#FBF7EF;--ink:#1f2838;--mut:rgba(251,247,239,.68);--ease:cubic-bezier(.22,.7,.2,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--navy-d);color:var(--cream);font-family:'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}

/* barre du haut */
.top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;z-index:5;background:linear-gradient(180deg,rgba(8,25,46,.9),rgba(8,25,46,0))}
.top img{width:34px;height:34px}
.top .t{font-family:'Fraunces',serif;font-size:18px;line-height:1.1}
.top .t small{display:block;font-family:'Jost';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l)}
.top .sp{flex:1}
.pill{border:1px solid rgba(251,247,239,.28);background:rgba(8,25,46,.35);color:var(--cream);font:500 12px 'Jost';letter-spacing:.06em;padding:7px 12px;border-radius:99px;cursor:pointer;text-decoration:none;backdrop-filter:blur(6px)}
.pill:hover{border-color:var(--gold)}

/* scène */
.stage{position:absolute;inset:0;overflow:hidden;background:#000}
.shot{position:absolute;inset:0;opacity:0;transition:opacity 1.1s var(--ease)}
.shot.on{opacity:1}
.shot .bg{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(28px) brightness(.55);transform:scale(1.1)}
.shot .fg{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;transform:translate3d(var(--x0),var(--y0),0) scale(var(--s0));will-change:transform}
.shot.on .fg{animation:kb var(--dur,9s) linear forwards}
@keyframes kb{to{transform:translate3d(var(--x1),var(--y1),0) scale(var(--s1))}}
.shot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,25,46,.0) 45%,rgba(8,25,46,.85) 100%)}
@media (min-aspect-ratio:1/1){.shot .fg{inset:4% 0 0;width:100%;height:92%;object-fit:contain}}
@media (prefers-reduced-motion:reduce){.shot.on .fg{animation:none}.shot{transition:none}}

/* légende */
.cap{position:absolute;left:0;right:0;bottom:0;padding:0 16px 14px;z-index:4;max-width:760px}
.step{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-l);margin-bottom:6px}
.cap h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.05}
.cap h1 em{font-style:italic;color:var(--gold-l)}
.cap p{margin-top:8px;color:var(--mut);font-size:15px;line-height:1.5;max-width:520px}
.cap .in{transition:opacity .45s,transform .6s var(--ease)}
.cap.swap .in{opacity:0;transform:translateY(10px)}

/* flèches */
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:46px;height:46px;border-radius:50%;border:1px solid rgba(251,247,239,.3);background:rgba(8,25,46,.35);backdrop-filter:blur(6px);color:var(--cream);display:grid;place-items:center;cursor:pointer}
.nav:hover{border-color:var(--gold)}
.nav.prev{left:14px}.nav.next{right:14px}
.nav svg{width:20px;height:20px}

/* barre de progression */
.prog{position:absolute;left:16px;right:16px;top:0;height:2px;display:flex;gap:4px;z-index:6}
.prog i{flex:1;background:rgba(251,247,239,.22);border-radius:2px;overflow:hidden}
.prog i b{display:block;height:100%;width:0;background:var(--gold)}
.prog i.done b{width:100%}
.prog i.cur b{animation:fill var(--dur,9s) linear forwards}
.paused .prog i.cur b{animation-play-state:paused}
.paused .shot.on .fg{animation-play-state:paused}
@keyframes fill{to{width:100%}}

/* plan */
.dock{position:relative;z-index:5;background:var(--navy-d);border-top:1px solid rgba(251,247,239,.08);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.dock .row{display:flex;align-items:center;justify-content:center;gap:14px;max-width:760px;margin:0 auto}
.plan{flex:1;min-width:0;max-width:560px}
.plan svg{width:100%;height:auto;display:block}
.plan .z{cursor:pointer}
.plan .z rect{fill:rgba(251,247,239,.05);stroke:rgba(251,247,239,.35);stroke-width:1;transition:fill .3s}
.plan .z text{fill:var(--mut);font:500 9px 'Jost';letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.plan .z:hover rect{fill:rgba(217,151,26,.12)}
.plan .z.on rect{fill:rgba(217,151,26,.22);stroke:var(--gold)}
.plan .z.on text{fill:var(--cream)}
.plan .dot{fill:var(--gold);transition:transform .6s var(--ease)}
.plan .pulse{fill:none;stroke:var(--gold);stroke-width:1.2;animation:pl 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(2.4)}}
.legend{font-size:10px;color:rgba(251,247,239,.42);margin-top:4px;letter-spacing:.04em}
.play{width:44px;height:44px;flex:none;border-radius:50%;border:none;background:var(--gold);color:var(--navy-d);display:grid;place-items:center;cursor:pointer}
.play svg{width:18px;height:18px}

/* fin */
.end{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:rgba(8,25,46,.78);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .6s}
.end.on{opacity:1;pointer-events:auto}
.end .box{text-align:center;padding:24px 16px;max-width:420px}
.end h2{font-family:'Fraunces',serif;font-weight:400;font-size:34px;line-height:1.1}
.end h2 em{color:var(--gold-l)}
.end p{color:var(--mut);margin:10px 0 20px}
.end .btns{display:flex;flex-direction:column;gap:10px}
.btn{display:block;padding:14px 18px;border-radius:99px;text-decoration:none;font-weight:500;letter-spacing:.03em}
.btn.gold{background:var(--gold);color:var(--navy-d)}
.btn.ghost{border:1px solid rgba(251,247,239,.35);color:var(--cream);background:none;font:inherit;cursor:pointer}

@media (max-width:600px){.nav{display:none}.cap p{font-size:14px}}
@media (min-width:900px){.cap{padding:0 40px 24px}.top{padding-left:40px;padding-right:40px}.prog{left:40px;right:40px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage" aria-live="polite"></div>
  <header class="top">
    <a href="/"><img src="assets/logo-white.png" alt="La Bonne Aventure"></a>
    <div class="t"><small data-t="kicker">Visite du studio</small>La Bonne Aventure</div>
    <div class="sp"></div>
    <button class="pill" id="lang" type="button">EN</button>
  </header>
  <div style="position:relative">
    <div class="prog" id="prog"></div>
    <button class="nav prev" id="prev" type="button" aria-label="Précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="nav next" id="next" type="button" aria-label="Suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="cap" id="cap"><div class="in"><div class="step" id="step"></div><h1 id="title"></h1><p id="desc"></p></div></div>
  </div>
  <div class="dock">
    <div class="row">
      <div class="plan">
        <svg viewBox="0 0 400 74" id="plan" role="group" aria-label="Plan du studio">
          <g class="z" data-z="cuisine"><rect x="1" y="10" width="118" height="58" rx="4"/><text x="60" y="43" text-anchor="middle" data-t="z.cuisine">Cuisine</text></g>
          <g class="z" data-z="nuit"><rect x="121" y="10" width="148" height="58" rx="4"/><text x="195" y="43" text-anchor="middle" data-t="z.nuit">Nuit · cinéma</text></g>
          <g class="z" data-z="sdb"><rect x="271" y="10" width="54" height="28" rx="4"/><text x="298" y="28" text-anchor="middle" data-t="z.sdb">Douche</text></g>
          <g class="z" data-z="cour"><rect x="327" y="10" width="72" height="58" rx="4"/><text x="363" y="43" text-anchor="middle" data-t="z.cour">Cour</text></g>
          <circle class="pulse" id="pulse" r="4" cx="60" cy="56"/>
          <circle class="dot" id="dot" r="4" cx="60" cy="56"/>
        </svg>
        <div class="legend" data-t="legend">Plan indicatif · touchez une zone</div>
      </div>
      <button class="play" id="play" type="button" aria-label="Pause"></button>
    </div>
  </div>
  <div class="end" id="end"><div class="box">
    <h2 data-t="end.h">À très vite <em>chez vous</em></h2>
    <p data-t="end.p">25 m² au calme, cour privée, à quelques minutes des thermes et du centre.</p>
    <div class="btns">
      <a class="btn gold" href="/" data-t="end.book">Voir les disponibilités</a>
      <button class="btn ghost" id="again" type="button" data-t="end.again">Revoir la visite</button>
    </div>
  </div></div>
</div>
<script>
const I18N={
 fr:{kicker:"Visite du studio",legend:"Plan indicatif · touchez une zone","z.cuisine":"Cuisine","z.nuit":"Nuit · cinéma","z.sdb":"Douche","z.cour":"Cour",
  "end.h":"À très vite <em>chez vous</em>","end.p":"25 m² au calme, cour privée, à quelques minutes des thermes et du centre.","end.book":"Voir les disponibilités","end.again":"Revoir la visite",step:"Étape",of:"sur"},
 en:{kicker:"Studio tour",legend:"Indicative plan · tap a zone","z.cuisine":"Kitchen","z.nuit":"Bed · cinema","z.sdb":"Shower","z.cour":"Yard",
  "end.h":"See you <em>very soon</em>","end.p":"A quiet 25 m² studio with a private yard, minutes from the spa and the town centre.","end.book":"Check availability","end.again":"Watch again",step:"Step",of:"of"}
};
const SHOTS=[
 {z:"cuisine",img:"studio-3.jpg",kb:["-2%","1%",1.04,"2%","-1%",1.12],
  fr:["La <em>cuisine</em>","Plaques à induction, micro-ondes, bouilloire, cafetière Nespresso et tout le nécessaire pour cuisiner."],
  en:["The <em>kitchen</em>","Induction hob, microwave, kettle, Nespresso machine and everything you need to cook."]},
 {z:"cuisine",img:"studio-2.jpg",kb:["2%","0%",1.1,"-2%","1%",1.03],
  fr:["Le <em>coin repas</em>","Une table haute pour le petit-déjeuner ou le télétravail, et un grand réfrigérateur congélateur."],
  en:["The <em>dining corner</em>","A high table for breakfast or remote work, and a large fridge-freezer."]},
 {z:"nuit",img:"studio-1.jpg",kb:["0%","2%",1.03,"0%","-1%",1.13],
  fr:["Le <em>coin nuit</em>","Lit double en rotin, linge en coton fourni, rangements et portant. Au fond, la cour."],
  en:["The <em>bedroom area</em>","Rattan double bed, cotton bed linen provided, storage and a clothes rail. The yard is at the end."]},
 {z:"nuit",img:"studio-6.jpg",kb:["0%","-2%",1.12,"0%","1%",1.03],
  fr:["L'espace <em>cinéma</em>","Vidéoprojecteur grand écran face au lit, pour vos soirées films et séries."],
  en:["The <em>cinema</em> corner","A big-screen projector facing the bed, for film and series nights."]},
 {z:"sdb",img:"studio-5.jpg",kb:["0%","2%",1.03,"0%","-2%",1.11],
  fr:["La <em>salle d'eau</em>","Douche, vasque et WC. Serviettes, gel douche et shampoing fournis."],
  en:["The <em>shower room</em>","Shower, washbasin and toilet. Towels, shower gel and shampoo provided."]},
 {z:"cour",img:"studio-4.jpg",kb:["-2%","0%",1.1,"2%","1%",1.03],
  fr:["La <em>cour privée</em>","Votre coin dehors, au calme, avec salon de jardin. Parfait pour un café au soleil."],
  en:["The <em>private yard</em>","Your quiet outdoor spot with garden furniture. Perfect for a coffee in the sun."]}
];
const ZPOS={cuisine:[60,56],nuit:[195,56],sdb:[298,52],cour:[363,56]};
const DUR=7000;
let lang=(new URLSearchParams(location.search).get('lang')||(navigator.language||'fr')).slice(0,2)==='en'?'en':'fr';
let cur=-1,playing=true,timer=null;
const $=id=>document.getElementById(id);
const stage=$('stage'),prog=$('prog'),app=$('app');
document.documentElement.style.setProperty('--dur',DUR+'ms');
SHOTS.forEach((s,i)=>{
  const d=document.createElement('div');d.className='shot';
  const k=s.kb;d.style.cssText=`--x0:${k[0]};--y0:${k[1]};--s0:${k[2]};--x1:${k[3]};--y1:${k[4]};--s1:${k[5]}`;
  d.innerHTML=`<img class="bg" src="assets/${s.img}" alt="" aria-hidden="true"><img class="fg" src="assets/${s.img}" alt="" decoding="async">`;stage.appendChild(d);
  prog.appendChild(Object.assign(document.createElement('i'),{innerHTML:'<b></b>'}));
});
const ICON={play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>',pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'};
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(e=>{const v=I18N[lang][e.dataset.t];if(v!=null)e.innerHTML=v});
  $('lang').textContent=lang==='fr'?'EN':'FR';
  if(cur>=0)setCap(cur,true);
}
function setCap(i,instant){
  const s=SHOTS[i],t=s[lang],cap=$('cap');
  const fill=()=>{$('step').textContent=`${I18N[lang].step} ${i+1} ${I18N[lang].of} ${SHOTS.length}`;$('title').innerHTML=t[0];$('desc').textContent=t[1];cap.classList.remove('swap')};
  if(instant){fill();return}
  cap.classList.add('swap');setTimeout(fill,320);
}
function go(i){
  $('end').classList.remove('on');
  i=(i+SHOTS.length)%SHOTS.length;
  const shots=stage.children;
  if(cur>=0)shots[cur].classList.remove('on');
  // relance l'animation Ken Burns
  const im=shots[i].querySelector('.fg');im.style.animation='none';void im.offsetWidth;im.style.animation='';
  shots[i].classList.add('on');
  [...prog.children].forEach((p,k)=>{p.className=k<i?'done':'';const b=p.firstChild;b.style.animation='none';void b.offsetWidth;b.style.animation=''});
  prog.children[i].className='cur';
  setCap(i,cur<0);cur=i;
  const z=SHOTS[i].z;document.querySelectorAll('.plan .z').forEach(g=>g.classList.toggle('on',g.dataset.z===z));
  const [x,y]=ZPOS[z];['dot','pulse'].forEach(id=>{$(id).setAttribute('cx',x);$(id).setAttribute('cy',y)});
  schedule();
}
function schedule(){clearTimeout(timer);if(playing)timer=setTimeout(()=>cur===SHOTS.length-1?finish():go(cur+1),DUR)}
function finish(){prog.children[cur].className='done';$('end').classList.add('on');setPlay(false)}
function setPlay(p){playing=p;app.classList.toggle('paused',!p);$('play').innerHTML=p?ICON.pause:ICON.play;$('play').setAttribute('aria-label',p?'Pause':'Lecture');if(p)schedule();else clearTimeout(timer)}
$('next').onclick=()=>cur===SHOTS.length-1?finish():go(cur+1);
$('prev').onclick=()=>go(cur-1);
$('play').onclick=()=>{if($('end').classList.contains('on')){go(0);setPlay(true);return}setPlay(!playing);if(playing)go(cur)};
$('again').onclick=()=>{go(0);setPlay(true)};
$('lang').onclick=()=>{lang=lang==='fr'?'en':'fr';applyLang()};
document.querySelectorAll('.plan .z').forEach(g=>g.onclick=()=>{const i=SHOTS.findIndex(s=>s.z===g.dataset.z);setPlay(false);go(i)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')go(cur-1);if(e.key===' '){e.preventDefault();$('play').click()}});
let sx=null;stage.parentElement.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>45){setPlay(false);dx<0?$('next').click():go(cur-1)}},{passive:true});
applyLang();setPlay(true);go(0);
</script>
</body>
</html>
