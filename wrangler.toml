# La Bonne Aventure — configuration Cloudflare Pages + Functions
# Le site statique (index/extras/guide + assets) est servi tel quel ;
# le dossier functions/ fournit l'API du moteur de réservation.

name = "la-bonne-aventure"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# --- Base de données D1 (réservations) ---
[[d1_databases]]
binding = "DB"
database_name = "lba-bookings"
database_id = "fa63348c-6632-488c-bf85-19d3d85331c3"

# --- Cache KV (calendrier iCal Airbnb, TTL 30 min) ---
[[kv_namespaces]]
binding = "CACHE"
id = "fd03377bc50f4a7bba923f98dea29a17"

# --- Variables non secrètes (ajustables) ---
# Les tarifs sont en CENTIMES. Laisser TAXE_CENTS=0 pour désactiver la taxe de séjour.
[vars]
CURRENCY = "eur"
NIGHTLY_CENTS = "6000"    # 60,00 € / nuit
CLEANING_CENTS = "4500"   # 45,00 € de ménage / séjour
MIN_NIGHTS = "2"
MAX_GUESTS = "2"
TAXE_CENTS = "0"          # taxe de séjour €/personne/nuit en centimes (0 = désactivée)
HOST_EMAIL = "theobonaventure1@gmail.com"
FROM_EMAIL = "contact@labonneaventure-aixlesbains.fr"   # domaine vérifié dans Resend requis
SITE_URL = "https://labonneaventure-aixlesbains.fr"
# ⚠️ Cette adresse ne fonctionne QUE si le domaine labonneaventure-aixlesbains.fr est
# « Verified » (vert) dans Resend (enregistrements DNS ajoutés). Sinon les emails ne
# partent pas — repasser temporairement à "onboarding@resend.dev".

# Note : après le 1er déploiement, les tarifs/réductions/taxe se règlent depuis la page
# /admin (stockés en base D1, table settings). Les [vars] ci-dessus ne servent que de
# valeurs initiales / de secours.

# --- Secrets (NE PAS mettre ici — voir README-deploiement.md) ---
# wrangler pages secret put AIRBNB_ICAL_URL
# wrangler pages secret put STRIPE_SECRET_KEY
# wrangler pages secret put STRIPE_WEBHOOK_SECRET
# wrangler pages secret put RESEND_API_KEY
# wrangler pages secret put ADMIN_PASSWORD     # mot de passe de la page /admin
# wrangler pages secret put ADMIN_SECRET       # chaîne aléatoire, signe le cookie admin
# wrangler pages secret put CRON_SECRET        # protège /api/cron/pending-reminders
